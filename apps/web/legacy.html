<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Ensign · 登录</title>
		<link rel="stylesheet" href="/assets/style.css" />
		<script type="module" src="/assets/client.mjs"></script>
	</head>
	<body>
		<main class="card">
			<p class="wordmark">Ensign</p>
			<h1 id="title">登录</h1>
			<p id="intro">使用你的账号继续。</p>
			<p id="status" role="status" aria-live="polite"></p>
			<form id="login" method="post" action="/api/login" hidden>
				<label for="handle">账号</label>
				<input id="handle" name="login" autocomplete="username" required />
				<label for="password">密码</label>
				<input id="password" name="pass" type="password" autocomplete="current-password" required />
				<button type="submit">登录</button>
			</form>
			<section id="session" hidden>
				<p id="identity"></p>
				<a href="/logout">退出登录</a>
			</section>
			<form id="logout" method="post" action="/api/logout" hidden>
				<button type="submit">退出登录</button>
			</form>
			<p id="again" hidden><a href="/login">返回登录</a></p>
			<noscript>请启用 JavaScript 以使用登录和退出页面。</noscript>
		</main>
	</body>
</html>
