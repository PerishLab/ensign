api:
  image: ghcr.io/perishlab/ensign
  # tag defaults to Chart.appVersion; override only to pin a different image
  tag: ""
  # A released tag is immutable, so IfNotPresent is right for delivery. Set
  # Always while iterating on a tag whose contents move under it.
  pullPolicy: IfNotPresent
  # Keep at 1. keel caches grant rows per engine instance, so a second
  # api pod keeps honouring a grant this one revoked until it writes.
  # Raising this needs the keel cache off first — see keel docs/run/cache.md
  # "Authority is cached too" (H-8).
  replicas: 1
  port: 3500
# Public https API root ensign issues tokens under, including /api. MUST be set:
# unset means the api falls back to http://<listen.host>:<port>, and listen.host is
# 0.0.0.0 here, so it would advertise an unreachable issuer. https also turns on the
# Secure flag on session cookies.
issuer: ""
ingress:
  enabled: true
  className: ""
  host: ensign.local
  # TLS is expressed two ways because clusters differ, and neither is baked in:
  #   - annotations: for a cluster holding a default certificate, ask for TLS without
  #     naming one (Traefik: traefik.ingress.kubernetes.io/router.tls: "true"); or point
  #     cert-manager at an issuer (cert-manager.io/cluster-issuer: letsencrypt-prod).
  #   - tls: the standard per-host form, e.g. [{secretName: ensign-tls, hosts: [...]}].
  annotations: {}
  tls: []
postgres:
  bundled: true
  # Point at an existing Secret instead of letting the chart hold the
  # credential. Set both fields; url and password are then ignored.
  urlSecret:
    name: ""
    key: ""
  url: ""
  image: postgres:17-alpine
  user: ensign
  db: ensign
  # Left empty on purpose. The chart generates one on first install and
  # preserves it across upgrades; a well-known default is not a credential.
  password: ""
  storage: 1Gi
bootstrap:
  # The Job replays an occupied estate, so a retry is cheap and safe.
  retries: 6
