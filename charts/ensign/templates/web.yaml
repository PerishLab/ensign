{{- if .Values.web.enabled }}
{{- if ne (toString .Values.web.replicas) "1" }}
{{- fail "Ensign web currently supports exactly one replica; web.replicas must be 1" }}
{{- end }}
{{- $client := dict }}
{{- with .Values.web.client }}
{{- if .issuer }}{{- $_ := set $client "issuer" .issuer }}{{- end }}
{{- if .client }}{{- $_ := set $client "client" .client }}{{- end }}
{{- if .folio }}{{- $_ := set $client "folio" .folio }}{{- end }}
{{- end }}
{{- if .Values.locus.enabled }}
{{- $_ := set $client "observe" "/api/observe" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image }}:{{ .Values.web.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: HOST
              value: "0.0.0.0"
          ports:
            - containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.web.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- if gt (len $client) 0 }}
          volumeMounts:
            - name: web-client
              mountPath: /web/dist/client.json
              subPath: client.json
      volumes:
        - name: web-client
          configMap:
            name: {{ .Release.Name }}-web-client
          {{- end }}
{{- if gt (len $client) 0 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-client
data:
  client.json: |
    {{ $client | toJson }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
{{- end }}
