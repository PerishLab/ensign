{{- $web := .Values.web | default dict }}
{{- $webEnabled := true }}
{{- if hasKey $web "enabled" }}
{{- $webEnabled = $web.enabled }}
{{- end }}
{{- if $webEnabled }}
{{- if ne (toString ($web.replicas | default 1)) "1" }}
{{- fail "Ensign web currently supports exactly one replica; web.replicas must be 1" }}
{{- end }}
{{- $clientCfg := $web.client | default dict }}
{{- $locus := .Values.locus | default dict }}
{{- $client := dict }}
{{- if $clientCfg.client }}
{{- $issuer := $clientCfg.issuer | default .Values.issuer }}
{{- if $issuer }}{{- $_ := set $client "issuer" $issuer }}{{- end }}
{{- $_ := set $client "client" $clientCfg.client }}
{{- else if $clientCfg.issuer }}
{{- $_ := set $client "issuer" $clientCfg.issuer }}
{{- end }}
{{- if $clientCfg.folio }}{{- $_ := set $client "folio" $clientCfg.folio }}{{- end }}
{{- if $locus.enabled }}
{{- $_ := set $client "observe" "/api/observe" }}
{{- end }}
{{- $payload := $client | toJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-client
data:
  client.json: {{ $payload | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
      annotations:
        checksum/client: {{ $payload | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: "{{ $web.image | default "ghcr.io/perishlab/ensign-web" }}:{{ $web.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $web.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PORT
              value: {{ $web.port | default 8080 | quote }}
            - name: HOST
              value: "0.0.0.0"
          ports:
            - containerPort: {{ $web.port | default 8080 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $web.port | default 8080 }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: web-client
              mountPath: /web/dist/client.json
              subPath: client.json
              readOnly: true
      volumes:
        - name: web-client
          configMap:
            name: {{ .Release.Name }}-web-client
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - port: {{ $web.port | default 8080 }}
      targetPort: {{ $web.port | default 8080 }}
{{- end }}
