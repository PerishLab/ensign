apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  annotations:
    # Runs after the store exists and before the release is called done.
    # Idempotent: an occupied estate is replayed, never re-minted.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.bootstrap.retries }}
  template:
    metadata:
      name: {{ .Release.Name }}-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-bootstrap
      containers:
        - name: bootstrap
          image: "{{ .Values.api.image }}:{{ .Values.api.tag | default .Chart.AppVersion }}"
          args:
            - bootstrap
            - /ensign
            - --artifact
            - sudo=kubernetes:{{ .Release.Name }}-sudo
            - --artifact
            - signing=kubernetes:{{ .Release.Name }}-signing
          env:
            - name: API_STORE_KIND
              value: "pg"
            - name: API_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ensign.storeseat" . }}
                  key: {{ include "ensign.storekey" . }}
            {{- if .Values.issuer }}
            - name: API_ISS
              value: {{ .Values.issuer | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /ensign/keel.toml
              subPath: keel.toml
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
