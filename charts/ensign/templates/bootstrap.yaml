{{- $api := .Values.api | default dict }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap-r{{ .Release.Revision }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-bootstrap
    spec:
      serviceAccountName: {{ .Release.Name }}-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bootstrap
          image: "{{ $api.image | default "ghcr.io/perishlab/ensign" }}:{{ $api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $api.pullPolicy | default "IfNotPresent" }}
          args:
            - bootstrap
            - /ensign
            - --artifact
            - sudo=kubernetes:{{ .Release.Name }}-sudo
            - --artifact
            - signing=kubernetes:{{ .Release.Name }}-signing
          env:
            - name: ENSIGN_STORE_KIND
              value: "pg"
            - name: ENSIGN_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ensign.storeseat" . }}
                  key: {{ include "ensign.storekey" . }}
            {{- if .Values.issuer }}
            - name: ENSIGN_ISS
              value: {{ .Values.issuer | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /ensign/ensign.toml
              subPath: ensign.toml
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
