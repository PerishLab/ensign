apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-genesis
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-genesis
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-genesis
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-genesis
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-genesis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-genesis
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-genesis
      restartPolicy: Never
      containers:
        - name: capture
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              rel={{ .Release.Name }}
              kubectl rollout status deploy/$rel-api --timeout=180s
              pod=$(kubectl get pod -l app=$rel-api -o jsonpath='{.items[0].metadata.name}')
              token=$(kubectl logs "$pod" | grep 'keel: sudo token' | tail -1 | awk '{print $NF}' || true)
              if [ -n "$token" ]; then
                kubectl create secret generic $rel-sudo \
                  --from-literal=token="$token" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "genesis: sudo token stored in secret $rel-sudo"
              else
                echo "genesis: no fresh token (already sealed) — leaving any prior secret in place"
              fi
