apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-bootstrap
rules:
  # create carries no name yet, so it cannot be narrowed by resourceNames.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Release.Name }}-sudo
      - {{ .Release.Name }}-signing
    verbs: ["get"]
# One ServiceAccount covers the whole pod, so RBAC can no longer keep sudo out
# of the serve container. That separation now rests on the binary: signing() at
# runtime refuses a sudo artifact outright (crates/api/src/artifact/mod.rs).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-bootstrap
