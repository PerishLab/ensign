apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-bootstrap
rules:
  # create carries no name yet, so it cannot be narrowed by resourceNames.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Release.Name }}-sudo
      - {{ .Release.Name }}-signing
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-bootstrap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-api
rules:
  # serve reads signing and never sudo: sudo custody stays out of the api seat.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Release.Name }}-signing
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-api
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-api
