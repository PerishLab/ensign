{{- $api := .Values.api | default dict }}
{{- $locus := .Values.locus | default dict }}
{{- if $locus.enabled }}
{{- if not $locus.endpoint }}
{{- fail "locus.endpoint must be set when locus.enabled is true" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  ensign.toml: |
    [listen]
    host = "0.0.0.0"
    port = {{ $api.port | default 8080 }}
    prefix = ""

    [store]
    kind = "memory"

    [cache]
    kind = "memory"
    {{- if $locus.enabled }}

    [locus]
    endpoint = {{ $locus.endpoint | quote }}
    producer = {{ $locus.producer | default "ensign-web" | quote }}
    buffer = {{ $locus.buffer | default "/tmp/ensign-locus-relay/spool" | quote }}
    {{- if $locus.origins }}
    origins = {{ join "," $locus.origins | quote }}
    {{- end }}
    rpm = {{ $locus.rpm | default 120 }}
    burst = {{ $locus.burst | default 30 }}
    forwarded = {{ if hasKey $locus "forwarded" }}{{ $locus.forwarded }}{{ else }}true{{ end }}
    {{- end }}
