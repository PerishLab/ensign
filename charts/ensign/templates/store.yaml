{{- $pg := .Values.postgres | default dict }}
{{- $urlSecret := $pg.urlSecret | default dict }}
{{- if not $urlSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-store
  annotations:
    # The store data outlives the release, so its credential must too.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # One generation, two fields. Rendering the helper twice would mint two
  # different passwords and the store would refuse its own url.
  {{- $pass := include "ensign.pgpass" . }}
  {{- $url := $pg.url | default (printf "host=%s-pg port=5432 user=%s password=%s dbname=%s" .Release.Name ($pg.user | default "ensign") $pass ($pg.db | default "ensign")) }}
  PGPASSWORD: {{ $pass | quote }}
  ENSIGN_STORE_URL: {{ $url | quote }}
  API_STORE_URL: {{ $url | quote }}
{{- end }}
