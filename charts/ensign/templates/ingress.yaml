{{- $ingress := .Values.ingress | default dict }}
{{- $api := .Values.api | default dict }}
{{- $web := .Values.web | default dict }}
{{- $webEnabled := true }}
{{- if hasKey $web "enabled" }}
{{- $webEnabled = $web.enabled }}
{{- end }}
{{- if $ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  {{- with $ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if $ingress.className }}
  ingressClassName: {{ $ingress.className }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ingress.host | default "ensign.local" | quote }}
      http:
        paths:
          {{- if $webEnabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: {{ $api.port | default 8080 }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  number: {{ $web.port | default 8080 }}
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: {{ $api.port | default 8080 }}
          {{- end }}
{{- end }}
