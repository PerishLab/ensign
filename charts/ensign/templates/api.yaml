apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      serviceAccountName: {{ .Release.Name }}-bootstrap
      # Bootstrap runs here rather than as a Job: a post-install hook cannot
      # reach the store before serve is ready, and a pre-install hook runs
      # before the store exists at all. The pod owns both, so the ordering is
      # structural. Replays are safe — see crates/api/tests/bootstrap.rs.
      initContainers:
        - name: bootstrap
          image: "{{ .Values.api.image }}:{{ .Values.api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          args:
            - bootstrap
            - /ensign
            - --artifact
            - sudo=kubernetes:{{ .Release.Name }}-sudo
            - --artifact
            - signing=kubernetes:{{ .Release.Name }}-signing
          env:
            - name: API_STORE_KIND
              value: "pg"
            - name: API_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ensign.storeseat" . }}
                  key: {{ include "ensign.storekey" . }}
            {{- if .Values.issuer }}
            - name: API_ISS
              value: {{ .Values.issuer | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /ensign/keel.toml
              subPath: keel.toml
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          args:
            - serve
            - /ensign
            - --artifact
            - signing=kubernetes:{{ .Release.Name }}-signing
          env:
            - name: API_STORE_KIND
              value: "pg"
            - name: API_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ensign.storeseat" . }}
                  key: {{ include "ensign.storekey" . }}
            {{- if .Values.issuer }}
            - name: API_ISS
              value: {{ .Values.issuer | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /ensign/keel.toml
              subPath: keel.toml
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
