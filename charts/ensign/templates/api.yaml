{{- $api := .Values.api | default dict }}
{{- $locus := .Values.locus | default dict }}
{{- $keySecret := $locus.keySecret | default dict }}
{{- $buffer := $locus.buffer | default "/tmp/ensign-locus-relay/spool" }}
{{- $mount := dir $buffer }}
{{- if ne (toString ($api.replicas | default 1)) "1" }}
{{- fail "Ensign currently supports exactly one API replica; api.replicas must be 1" }}
{{- end }}
{{- if and $locus.enabled (not $keySecret.name) }}
{{- fail "locus.keySecret.name must be set when locus.enabled is true" }}
{{- end }}
{{- if and $locus.enabled (or (eq $mount "/") (eq $mount ".") (eq $mount $buffer)) }}
{{- fail "locus.buffer must be a subdirectory inside a non-root mount path (e.g. /tmp/ensign-locus-relay/spool)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: "{{ $api.image | default "ghcr.io/perishlab/ensign" }}:{{ $api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $api.pullPolicy | default "IfNotPresent" }}
          args:
            - serve
            - /ensign
            - --artifact
            - signing=kubernetes:{{ .Release.Name }}-signing
          env:
            - name: ENSIGN_STORE_KIND
              value: "pg"
            - name: ENSIGN_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ensign.storeseat" . }}
                  key: {{ include "ensign.storekey" . }}
            {{- if .Values.issuer }}
            - name: ENSIGN_ISS
              value: {{ .Values.issuer | quote }}
            {{- end }}
            {{- if and $locus.enabled $keySecret.name }}
            - name: ENSIGN_LOCUS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $keySecret.name }}
                  key: {{ $keySecret.key | default "value" }}
            {{- end }}
          ports:
            - containerPort: {{ $api.port | default 8080 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ $api.port | default 8080 }}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /ensign/ensign.toml
              subPath: ensign.toml
            {{- if $locus.enabled }}
            - name: locus-buffer
              mountPath: {{ $mount | quote }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if $locus.enabled }}
        - name: locus-buffer
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ $api.port | default 8080 }}
      targetPort: {{ $api.port | default 8080 }}
