[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The public Ensign client, CLI and API server."

[[layout.seat]]
path = "apps/*"
anchor = []
note = "Independent Web application and its tests."

[[layout.seat]]
path = "deploy"
note = "The local compose surface and its configuration."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "clippy.toml"]
note = "Rust workspace anchors and the clippy method bans."

[[layout.file]]
name = [".npmrc", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json"]
note = "The pnpm workspace anchors held for the web plane."

[[layout.file]]
name = ["DESIGN.md"]
note = "Identity-resource and ceremony doctrine."

[[layout.file]]
name = ["Containerfile"]
note = "The ensign-api image wharf builds; it bakes in no configuration."

[[layout.file]]
name = ["ensign.toml", ".dockerignore"]
note = "Local runtime configuration."

[identity]
ns = "ensign"

[release]
authority = "https://releases.ensign.perish.uk"
binaries = ["ensign", "ensign-api"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = true

[release.cargo]
registry = "perish"
packages = ["ensign-client"]

[release.binary.ensign-api]
targets = ["x86_64-unknown-linux-gnu"]
install = false

[release.oci]
registry = "ghcr.io"
account = "PerishLab"

[release.oci.components.api]
image = "perishlab/ensign"
binary = "ensign-api"

[release.oci.components.web]
image = "perishlab/ensign-web"
web = "apps/web"
file = "deploy/web.Dockerfile"

[release.chart]
registry = "ghcr.io"
chart = "perishlab/ensign"
account = "PerishLab"

[[ectropy.grant]]
paths = [
    "crates/api/src/startup/site.rs",
    "crates/cli/src/cookbook.rs",
]
syntax = "embed"

[[ectropy.grant]]
paths = [
    "apps/web/vite.config.ts",
    "crates/api/src/config.rs",
    "crates/cli/src/config.rs",
]
syntax = "environment"

[sidecar.project]
name = "ensign"
namespace = "ensign"
root = "."

[sidecar.app]
name = "web"
command = "pnpm"
args = ["--filter", "@perishlab/ensign-web", "dev", "--host", "127.0.0.1"]
cwd = "."
mode = "dev"
port = 0
health_url = "http://127.0.0.1:{port}"
inherits_env = [{ name = "API_URL", from = "api.endpoint" }]

[[sidecar.sidecars]]
name = "api"
command = "cargo"
args = ["run", "--locked", "-p", "api", "--", "."]
cwd = "."
mode = "dev"
port = 0
env = { KEEL_LISTEN_PORT = "{port}" }
health_url = "http://127.0.0.1:{port}/api/health"
ready = { role = "api" }

[[sidecar.sidecars]]
name = "web-built"
command = "node"
args = ["apps/web/dist/.perish/server.mjs", "apps/web/dist"]
cwd = "."
mode = "built"
port = 0
env = { HOST = "127.0.0.1", PORT = "{port}" }
health_url = "http://127.0.0.1:{port}"
inherits_env = [{ name = "API_URL", from = "api.endpoint" }]
