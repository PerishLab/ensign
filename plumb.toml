[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The api server, a keel caller, and the ensign CLI."

[[layout.seat]]
path = "apps/*"
anchor = []
note = "The deferred web plane; the seat is held so the delivery paradigm can return."

[[layout.seat]]
path = "deploy"
note = "The runtime image and the compose surface."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed Runseal resources and the two remaining wrappers."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
note = "Rust workspace anchors and the toolchain wharf builds with."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json"]
note = "The pnpm workspace anchors held for the web plane."

[[layout.file]]
name = ["DESIGN.md"]
note = "Identity-resource and ceremony doctrine."

[[layout.file]]
name = ["ensign.toml", "docker-compose.yml", ".dockerignore"]
note = "Local runtime configuration and the compose entry."

[release]
product = "ensign"
authority = "https://releases.ensign.perish.uk"
binaries = ["ensign"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = true
