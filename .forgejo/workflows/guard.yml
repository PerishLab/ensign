name: guard

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Guard
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          plumb doctor .
          ectropy .
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo check --locked --workspace --all-targets --release
          deno fmt --check .runseal
          deno check \
            --config .runseal/deno.json \
            --lock .runseal/deno.lock \
            --frozen=true \
            .runseal/wrappers/act.ts \
            .runseal/wrappers/ship.ts

      - name: Chart
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          if command -v helm >/dev/null 2>&1; then
            helm lint charts/ensign --quiet
          else
            echo "helm absent: chart lint stays a local gate"
          fi

      - name: Acts
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          deno run \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-net \
            --allow-run \
            --config .runseal/deno.json \
            --lock .runseal/deno.lock \
            --frozen=true \
            .runseal/wrappers/act.ts
