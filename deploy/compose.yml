# The owner is plumb.toml's [identity] ns; the lane comes from PERISH_LANE,
# which a Runseal lane profile supplies. A lane holds nothing precious:
# `down -v` then `up` rebuilds it, sudo and signing key included. Nothing
# publishes a host port: reach a lane with `exec` or the `tools` profile.
# Only `api` joins the shared lane network, as api.ensign.internal, and only
# `bootstrap` writes to the shared lane volume, under `ensign/`: the keys of
# the consumers it declares. Create both once per lane with `docker network
# create` and `docker volume create`, each labelled `perish.owner=perish` and
# `perish.lane=<lane>` and named `perish-<lane>`.
name: ensign-${PERISH_LANE:-main}

x-lane: &lane
  perish.owner: ensign
  perish.lane: ${PERISH_LANE:-main}

services:
  pg:
    image: postgres:17-alpine
    labels: *lane
    environment:
      POSTGRES_USER: ensign
      POSTGRES_PASSWORD: ensign
      POSTGRES_DB: ensign
    volumes:
      - pg:/var/lib/postgresql/data
      - ./acts.sql:/docker-entrypoint-initdb.d/acts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensign"]
      interval: 2s
      timeout: 3s
      retries: 20
  # Prepares ensign's own seat in the shared volume for the non-root bootstrap.
  seat:
    profiles: [stack]
    image: busybox:1.37
    labels: *lane
    command: ["sh", "-c", "mkdir -p /perish/ensign && chown 10001 /perish/ensign"]
    volumes:
      - perish:/perish
  bootstrap:
    profiles: [stack]
    image: ensign-api:dev
    labels: *lane
    build:
      context: ..
      dockerfile: Containerfile
    environment:
      API_STORE_KIND: "pg"
      API_STORE_URL: "host=pg port=5432 user=ensign password=ensign dbname=ensign"
      API_ISS: "http://api.ensign.internal:3500/api"
    command:
      - bootstrap
      - /ensign
      - --artifact
      - sudo=file:/ensign/sudo
      - --artifact
      - signing=file:/ensign/.local/sign.pem
      - --artifact
      - key:codehull=file:/perish/ensign/codehull.key
    volumes:
      - custody:/ensign
      - ./ensign.toml:/ensign/ensign.toml:ro
      - sign:/ensign/.local
      - perish:/perish
    depends_on:
      pg:
        condition: service_healthy
      seat:
        condition: service_completed_successfully
  api:
    profiles: [stack]
    image: ensign-api:dev
    labels: *lane
    environment:
      API_STORE_KIND: "pg"
      API_STORE_URL: "host=pg port=5432 user=ensign password=ensign dbname=ensign"
      API_ISS: "http://api.ensign.internal:3500/api"
    command: ["serve", "/ensign", "--artifact", "signing=file:/ensign/.local/sign.pem"]
    networks:
      default: {}
      lane:
        aliases: [api.ensign.internal]
    volumes:
      - ./ensign.toml:/ensign/ensign.toml:ro
      - sign:/ensign/.local
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/3500 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      bootstrap:
        condition: service_completed_successfully
  # The acts on the lane's Postgres. The checkout is read-only and cargo
  # writes only to lane volumes; API_FRESH wipes ensign_acts, never ensign.
  runner:
    profiles: [tools]
    image: ghcr.io/perishlab/images:stable
    labels: *lane
    working_dir: /src
    entrypoint: []
    environment:
      CARGO_TARGET_DIR: /target
      API_STORE_URL: "host=pg port=5432 user=ensign password=ensign dbname=ensign_acts"
    volumes:
      - ..:/src:ro
      - target:/target
      - registry:/usr/local/cargo/registry
      - git:/usr/local/cargo/git
    depends_on:
      pg:
        condition: service_healthy

volumes:
  pg:
    labels: *lane
  custody:
    labels: *lane
  sign:
    labels: *lane
  target:
    labels: *lane
  registry:
    labels: *lane
  git:
    labels: *lane
  perish:
    name: perish-${PERISH_LANE:-main}
    external: true

networks:
  default:
    labels: *lane
  lane:
    name: perish-${PERISH_LANE:-main}
    external: true
