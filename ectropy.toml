[comment]
allow = false

[[grant]]
paths = [
  "apps/*/tests/**/*.test.ts",
  "apps/*/tests/**/*.test.tsx",
  "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = [
  "apps/*/tests/**/*.test.ts",
  "apps/*/tests/**/*.test.tsx",
  "apps/web/vite.config.ts",
  "crates/*/tests/**/*.rs",
  "crates/api/src/config.rs",
  "crates/cli/src/config.rs",
]
syntax = "environment"

[[ban]]
paths = ["apps/web/src/lib/components/**"]
syntax = "style"

[[boundary]]
paths = [
  "apps/web/vite.config.ts",
  "apps/web/vitest.config.ts",
]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
allow = ["path"]

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
  "apps/*/src",
  "apps/*/tests",
  "crates/*/src",
  "crates/*/tests",
  "docs",
]

[scan]
exclude = [
  "**/dist/**",
  "**/node_modules/**",
  "**/target/**",
]
include = [
  "apps/**/*.css",
  "apps/**/*.scss",
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "crates/**/*.rs",
  "docs/**/*.md",
]

[word]
single = true
