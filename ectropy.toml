[[ban]]
paths = ["apps/web/src/lib/components/**"]
syntax = "style"

[comment]
allow = false

[[grant]]
paths = ["crates/api/src/startup/site.rs"]
syntax = "embed"

[[grant]]
paths = ["crates/cli/src/cookbook.rs"]
syntax = "embed"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.cjs",
    "apps/*/tests/**/*.test.cts",
    "apps/*/tests/**/*.test.js",
    "apps/*/tests/**/*.test.jsx",
    "apps/*/tests/**/*.test.mjs",
    "apps/*/tests/**/*.test.mts",
    "apps/*/tests/**/*.test.ts",
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.cjs",
    "apps/*/tests/**/*.test.cts",
    "apps/*/tests/**/*.test.js",
    "apps/*/tests/**/*.test.jsx",
    "apps/*/tests/**/*.test.mjs",
    "apps/*/tests/**/*.test.mts",
    "apps/*/tests/**/*.test.ts",
    "apps/*/tests/**/*.test.tsx",
    "apps/web/vite.config.ts",
    "crates/*/tests/**/*.rs",
    "crates/api/src/config.rs",
    "crates/cli/src/config.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "apps/*",
    "apps/*/src",
    "apps/*/tests",
    "crates/*/src",
    "crates/*/tests",
]

[scan]
exclude = [
    "**/.svelte-kit/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/target/**",
]
include = [
    "apps/**/*.cjs",
    "apps/**/*.css",
    "apps/**/*.cts",
    "apps/**/*.js",
    "apps/**/*.jsx",
    "apps/**/*.mjs",
    "apps/**/*.mts",
    "apps/**/*.scss",
    "apps/**/*.svelte",
    "apps/**/*.ts",
    "crates/**/*.rs",
]

[word]
single = true
