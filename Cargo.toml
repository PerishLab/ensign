[workspace]
resolver = "3"
members = ["crates/api", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/ensign"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
keel = { version = "0.10.2", registry = "perish", features = ["pg"] }
keel-gate = { version = "0.10.2", registry = "perish" }
plumb = { version = "0.18.5", registry = "perish" }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "rustls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
